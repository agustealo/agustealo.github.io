---
layout: default
---
<article class="post" aria-labelledby="post-title">
  <header class="post-header">
    <h1 id="post-title" class="post-title">{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%b %-d, %Y" }}</time>
      {% if page.author %}<span aria-hidden="true"> · </span>{{ page.author }}{% endif %}
      {% if page.meta %}<span aria-hidden="true"> · </span>{{ page.meta }}{% endif %}
    </p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <footer class="post-footer">
    <a href="{{ '/#blog' | relative_url }}">Back to blog</a>
  </footer>
</article>
