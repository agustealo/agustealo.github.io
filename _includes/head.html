<!-- _includes/head.html -->
<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  {% assign meta_title = page.title | default: site.title %}
  {% assign meta_description = page.description | default: site.description %}
  <title>{{ meta_title | escape }}</title>
  <meta name="description" content="{{ meta_description | strip_html | strip_newlines | escape }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">

  <link href="{{ '/css/style.css' | relative_url }}" rel="stylesheet">
</head>
