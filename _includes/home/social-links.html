<div id="social-area" aria-label="Social profiles">
  <div class="row">
    <div class="col-10">
      <nav id="social" class="py-5" aria-label="Social media">
        <ul class="social-profile-list">
          {% for profile in site.social_links %}
            <li>
              <a href="{{ profile.url }}"
                 title="Visit Agustealo on {{ profile.name }}"
                 aria-label="Agustealo on {{ profile.name }}"
                 target="_blank"
                 rel="noopener noreferrer">
                <img src="{{ '/images/icons/' | append: profile.icon | relative_url }}"
                     alt=""
                     width="24"
                     height="24"
                     loading="lazy"
                     decoding="async">
                <span class="visually-hidden">{{ profile.name }}</span>
              </a>
            </li>
          {% endfor %}
        </ul>
      </nav>
    </div>
  </div>
</div>
