name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Verify bundle
        run: bundle check

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --trace --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Smoke production artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/feed.xml
          test -f _site/sitemap.xml
          test -f _site/css/style.css
          test -f _site/js/JekyllTwilight.js
          test -f _site/js/JekyllTwilight-portfolio.js
          test ! -e _site/twitter
          test ! -f _site/js/JekyllTwilight-slider.js
          grep -q 'id="hero-title"' _site/index.html
          grep -q 'rel="alternate" type="application/rss+xml"' _site/index.html
          grep -q '<rss version="2.0"' _site/feed.xml
          ! grep -q 'YOUR_CONSUMER_KEY' _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
